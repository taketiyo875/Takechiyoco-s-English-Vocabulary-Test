            q = data.slice(0, c); idx = 0; score = 0;
            document.getElementById('home').classList.add('hidden');
            document.getElementById('quiz').classList.remove('hidden');
            show();
        }
        function show() {
            if(idx >= q.length) { alert(score + '問正解にゃ！'); document.getElementById('home').classList.remove('hidden'); document.getElementById('quiz').classList.add('hidden'); return; }
            document.getElementById('word').innerText = q[idx].word;
            let o = [q[idx].ans, q[idx].w1, q[idx].w2, q[idx].w3].sort(()=>Math.random()-0.5);
            let div = document.getElementById('opts'); div.innerHTML = '';
            o.forEach(x => {
                let b = document.createElement('button'); b.className='btn'; b.innerText=x;
                b.onclick = () => { if(x===q[idx].ans) score++; idx++; show(); };
                div.appendChild(b);
            });
        }
        function home() {
            if(confirm('ホームに戻ると現在のデータが消えるけど大丈夫かニャ？')) {
                document.getElementById('home').classList.remove('hidden');
                document.getElementById('quiz').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
