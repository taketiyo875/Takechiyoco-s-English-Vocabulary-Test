<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #FFF5EE;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.15);
            border: 3px solid #FFA500;
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            color: #FF7F50;
            margin-top: 0;
            font-size: 24px;
        }
        .cat-decoration {
            font-size: 24px;
            margin-bottom: 15px;
        }
        .btn {
            background-color: #FF8C00;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            width: 100%;
            margin-bottom: 12px;
            font-weight: bold;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: #FF7F50;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-home {
            background-color: #708090;
            margin-top: 20px;
        }
        .btn-home:hover {
            background-color: #5f6d7a;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 2px solid #FFA500;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            font-weight: bold;
            color: #D2691E;
        }
        #quiz-screen, #result-screen {
            display: none;
        }
        .question-text {
            font-size: 32px;
            font-weight: bold;
            color: #FF4500;
            margin: 20px 0;
        }
        .progress {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        .score {
            font-size: 24px;
            font-weight: bold;
            color: #FF4500;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="cat-decoration">🐾 🐱 🐾</div>
    
    <!-- ホーム画面 -->
    <div id="home-screen">
        <h1>英検3級 単語テスト (ファイル3/4)</h1>
        <p>レベルを選んでクイズに挑戦するニャ！</p>
        
        <label for="level-select">難易度:</label>
        <select id="level-select">
            <option value="all">すべて</option>
            <option value="初級">初級</option>
            <option value="中級">中級</option>
            <option value="上級">上級</option>
        </select>
        
        <label for="count-input">出題問数:</label>
        <input type="number" id="count-input" value="10" min="1" max="500">
        
        <button class="btn" onclick="startQuiz()">スタート🐾</button>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen">
        <div class="progress" id="progress-text">1 / 10 問目</div>
        <div class="question-text" id="question-word">word</div>
        <div id="choices-container">
            <button class="btn choice-btn" onclick="checkAnswer(0)">選択肢1</button>
            <button class="btn choice-btn" onclick="checkAnswer(1)">選択肢2</button>
            <button class="btn choice-btn" onclick="checkAnswer(2)">選択肢3</button>
            <button class="btn choice-btn" onclick="checkAnswer(3)">選択肢4</button>
        </div>
        <button class="btn btn-home" onclick="goHome()">ホームに戻る</button>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen">
        <h1>結果発表だニャ！</h1>
        <div class="score" id="score-text">0 / 0 問正解</div>
        <p id="result-comment">お疲れ様だニャ！</p>
        <button class="btn" onclick="restart()">もう一度やる</button>
    </div>
</div>

let currentQuestions = [];
let currentIndex = 0;
let score = 0;

function startQuiz() {
    const level = document.getElementById('level-select').value;
    let maxCount = parseInt(document.getElementById('count-input').value) || 10;
    
    // フィルター
    let filtered = wordData;
    if (level !== 'all') {
        filtered = wordData.filter(w => w.level === level);
    }
    
    if (filtered.length === 0) {
        alert('該当するレベルの単語がありません。');
        return;
    }
    
    // シャッフル
    filtered.sort(() => Math.random() - 0.5);
    
    // 出題数決定
    if (maxCount > filtered.length) maxCount = filtered.length;
    currentQuestions = filtered.slice(0, maxCount);
    
    currentIndex = 0;
    score = 0;
    
    document.getElementById('home-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('result-screen').style.display = 'none';
    
    showQuestion();
}

function showQuestion() {
    const q = currentQuestions[currentIndex];
    document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${currentQuestions.length} 問目`;
    document.getElementById('question-word').innerText = q.word;
    
    // 4択作成 (不正解選択肢の抽出)
    let incorrects = wordData.filter(w => w.meaning !== q.meaning).map(w => w.meaning);
    incorrects.sort(() => Math.random() - 0.5);
    
    let choices = [q.meaning, incorrects[0], incorrects[1], incorrects[2]];
    // シャッフル
    choices.sort(() => Math.random() - 0.5);
    
    const container = document.getElementById('choices-container');
    container.innerHTML = '';
    choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'btn choice-btn';
        btn.innerText = choice;
        btn.onclick = () => checkAnswer(choice === q.meaning);
        container.appendChild(btn);
    });
}

function checkAnswer(isCorrect) {
    if (isCorrect) {
        score++;
        alert('正解だニャ！🎉');
    } else {
        const q = currentQuestions[currentIndex];
        alert(`残念、間違いだニャ。正解は「${q.meaning}」だニャ！🐾`);
    }
    
    currentIndex++;
    if (currentIndex < currentQuestions.length) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    document.getElementById('score-text').innerText = `${score} / ${currentQuestions.length} 問正解`;
    
    const rate = score / currentQuestions.length;
    let comment = '素晴らしいニャ！完璧だニャ！😻';
    if (rate < 0.4) comment = 'もう少し頑張るニャ...🐾';
    else if (rate < 0.8) comment = 'ナイスファイトだニャ！😸';
    
    document.getElementById('result-comment').innerText = comment;
}

function goHome() {
    if (confirm('ホームに戻ると現在のデータが消えるけど大丈夫かニャ？')) {
        document.getElementById('home-screen').style.display = 'block';
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
    }
}

function restart() {
    document.getElementById('home-screen').style.display = 'block';
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'none';
}
</script>
</body>
</html>
